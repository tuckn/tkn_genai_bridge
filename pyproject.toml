[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tkn-genai-bridge"
version = "0.4.0"
description = "Shared structured generation bridge with a Python API and CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tuckn" }]
dependencies = [
  "azure-identity>=1.25,<2",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "referencing>=0.36,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "litellm>=1.102,<1.103",
  "openai>=2.54,<3",
]

[project.scripts]
tkn-genai-bridge = "tkn_genai_bridge.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML", "types-jsonschema"]

[tool.hatch.build.targets.wheel]
packages = ["src/tkn_genai_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
